name: fieldwork-ops

services:
  db:
    image: postgres:15
    container_name: fieldwork-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldwork}
      POSTGRES_USER: ${DB_USER:-fieldwork}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready is the honest readiness signal for Postgres.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldwork} -d ${DB_NAME:-fieldwork}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fieldwork-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fieldwork}
      DB_USER: ${DB_USER:-fieldwork}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
    name: fieldwork-pgdata
