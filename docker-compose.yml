name: fieldwork-ops

services:
  db:
    image: postgres:15
    container_name: fieldwork-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldwork}
      POSTGRES_USER: ${DB_USER:-fieldwork}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready is the honest readiness signal for Postgres.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldwork} -d ${DB_NAME:-fieldwork}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  localstack:
    # S3 emulation for attachment storage in local dev. The bucket is
    # created by the init script mounted below (./localstack/init/ready.d
    # runs once the container is ready); no manual step needed.
    image: localstack/localstack
    container_name: fieldwork-localstack
    restart: unless-stopped
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-fieldwork-attachments}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # The readiness endpoint only answers 200 once init scripts have run,
      # so a healthy localstack means the bucket already exists.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fieldwork-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fieldwork}
      DB_USER: ${DB_USER:-fieldwork}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # Inside compose the app reaches LocalStack via the service name.
      S3_ENDPOINT: http://localstack:4566
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-fieldwork-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  pgdata:
    name: fieldwork-pgdata
