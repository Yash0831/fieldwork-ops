server:
  port: 8080
  # Fail fast on ambiguous trailing-slash mappings; keeps the API surface predictable.
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: fieldwork-ops

  servlet:
    multipart:
      # Container ceiling for multipart uploads. Deliberately a little
      # higher than app.s3.max-file-size so the service's own validation
      # (400 with a clear message) fires before the container rejects
      # the request.
      max-file-size: 12MB
      max-request-size: 12MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fieldwork}
    username: ${DB_USER:fieldwork}
    password: ${DB_PASSWORD:changeme}
    hikari:
      # Modest pool for a single-instance service; tune when scaling out.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    # Flyway owns the schema. `validate` makes the app refuse to boot if the
    # entities drift from the migrations — schema changes go through Flyway,
    # never through Hibernate auto-DDL.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # All timestamps are stored in UTC; conversion happens at the edges.
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # JSON everywhere, including actuator output. Keeps log aggregation simple.
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: fieldwork-ops
    description: Field Service Work-Order & SLA Management Platform

# Phase 3 dispatch rules: workload guard for technician assignment.
dispatch:
  # A technician may hold at most this many OPEN/IN_PROGRESS tickets;
  # further assignment is rejected until their load drops.
  max-open-tickets-per-technician: 8

# Phase 5 security settings.
app:
  jwt:
    # HMAC-SHA-256 signing secret for access tokens. Real deployments MUST
    # set JWT_SECRET (see .env.example): the default below is dev-only and
    # logs a warning at startup. Minimum 32 bytes / 256 bits.
    secret: ${JWT_SECRET:dev-only-insecure-default-jwt-secret-min-32-bytes}
    # Short-lived access tokens; longer sessions ride the rotating
    # opaque refresh tokens (stored hashed in refresh_tokens).
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    # Comma-separated SPA origins allowed to call the API. Locked down —
    # never "*" when credentials are allowed.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  s3:
    # Object storage for ticket attachments (Phase 7). All values are
    # overridable via environment variables (Spring relaxed binding).
    #
    # endpoint: S3_ENDPOINT. LocalStack URL in dev — http://localstack:4566
    #   inside docker compose, http://localhost:4566 when the app runs
    #   outside compose. Leave empty in production: the SDK then resolves
    #   the real regional S3 endpoint.
    # region / bucket / access-key / secret-key: S3_REGION, S3_BUCKET,
    #   S3_ACCESS_KEY, S3_SECRET_KEY. The "test"/"test" credentials are
    #   what LocalStack expects; real deployments MUST set real keys.
    # max-file-size: S3_MAX_FILE_SIZE, in bytes (default 10 MiB).
    # allowed-content-types: S3_ALLOWED_CONTENT_TYPES, comma-separated.
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:fieldwork-attachments}
    access-key: ${S3_ACCESS_KEY:test}
    secret-key: ${S3_SECRET_KEY:test}
    max-file-size: ${S3_MAX_FILE_SIZE:10485760}
    allowed-content-types: ${S3_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,application/pdf,text/plain}

logging:
  level:
    com.fieldwork.ops: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  # No JSON log layout is configured: logging is plain console output.
  # The correlation ID is available on the MDC under `correlationId`
  # for every request (see CorrelationIdFilter).

# Phase 6 async/event processing. All values have built-in defaults and
# can be overridden via environment variables (Spring relaxed binding):
# SLA_SCAN_CRON, NOTIFICATION_RETRY_FIXED_DELAY,
# NOTIFICATION_RETRY_MAX_ATTEMPTS, NOTIFICATION_RETRY_BATCH_SIZE.
sla:
  scan:
    # Cron for the SLA breach-scan job (Spring 6-field format, seconds
    # first). Default: every 5 minutes.
    cron: "0 */5 * * * *"

notification:
  retry:
    # Poll interval for the notification retry worker, in milliseconds.
    fixed-delay: 60000
    # Delivery attempts stamped onto each new notification before the
    # worker parks it in DEAD_LETTER.
    max-attempts: 5
    # Max due notifications processed in a single worker run.
    batch-size: 100
